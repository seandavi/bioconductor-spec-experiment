cases:
  - id: ir-cat-basic
    clause: IR-CAT-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3]}}
      y: {IRanges: {start: [20], width: [4]}}
    call: {op: c, args: [x, y, x]}
  - id: ir-cat-names-pad
    clause: IR-CAT-NAMES-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3], names: [a, b]}}
      y: {IRanges: {start: [20], width: [4]}}
    call: {op: c, args: [x, y]}
  - id: ir-cat-names-pad-first
    clause: IR-CAT-NAMES-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3]}}
      y: {IRanges: {start: [20], width: [4], names: [z]}}
    call: {op: c, args: [x, y]}
  - id: ir-cat-mcols-fill
    clause: IR-CAT-MCOLS-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3], mcols: {s: [1, 2]}}}
      y: {IRanges: {start: [20], width: [4], mcols: {s: [9], t: [q]}}}
    call: {op: c, args: [x, y]}
  - id: ir-cat-mcols-one-side
    clause: IR-CAT-MCOLS-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3], mcols: {s: [1, 2]}}}
      y: {IRanges: {start: [20], width: [4]}}
    call: {op: c, args: [x, y]}
  - id: ir-cat-with-empty
    clause: IR-CAT-EMPTY-1
    inputs:
      x: {IRanges: {start: [1, 5], width: [2, 3], names: [a, b]}}
      e: {IRanges: {start: [], width: []}}
    call: {op: c, args: [e, x, e]}
