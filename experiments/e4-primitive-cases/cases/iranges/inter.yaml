      x: {IRanges: {start: [1, 5, 3, 10, 11, 20, 25, 25], width: [2, 3, 6, 0, 3, 1, 0, 2], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}}}
    call: {op: range, args: [x]}
  - id: ir-range-zero-width
    clause: IR-RANGE-1
