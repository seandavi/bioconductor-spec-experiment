cases:
  - id: ir-con-start-width
    clause: IR-CON-START-WIDTH-1
    inputs:
      x: {IRanges: {start: [1, 5, 10], width: [3, 1, 4]}}
    call: {op: identity, args: [x]}
  - id: ir-con-start-end
    clause: IR-CON-START-END-1
    inputs:
      x: {IRanges: {start: [1, 5, 10], end: [3, 5, 13]}}
    call: {op: identity, args: [x]}
  - id: ir-con-end-width
    clause: IR-CON-END-WIDTH-1
    inputs:
      x: {IRanges: {end: [3, 5, 13], width: [3, 1, 4]}}
    call: {op: identity, args: [x]}
  - id: ir-con-empty
    clause: IR-CON-EMPTY-1
    inputs:
      x: {IRanges: {start: [], width: []}}
    call: {op: identity, args: [x]}
  - id: ir-con-zero-width
    clause: IR-CON-ZEROWIDTH-1
    inputs:
      x: {IRanges: {start: [5, 1], width: [0, 0]}}
    call: {op: identity, args: [x]}
  - id: ir-con-negative-width
    clause: IR-CON-NEGWIDTH-1
    inputs:
      x: {IRanges: {start: [5], width: [-1]}}
    call: {op: identity, args: [x]}
  - id: ir-con-names-na
    clause: IR-CON-NAMES-1
    inputs:
      x: {IRanges: {start: [1, 2, 3], width: [1, 1, 1], names: [a, null, c]}}
    call: {op: identity, args: [x]}
  - id: ir-con-mcols
    clause: IR-CON-MCOLS-1
    inputs:
      x: {IRanges: {start: [1, 2], width: [1, 1], mcols: {score: [1.5, null], tag: [a, b], flag: [true, false]}}}
    call: {op: identity, args: [x]}
  - id: ir-con-recycle
    clause: IR-CON-RECYCLE-1
    inputs:
      x: {IRanges: {start: [1, 2, 3], width: [2]}}
    call: {op: identity, args: [x]}
  - id: ir-con-all-three
    clause: IR-CON-ALL3-1
    inputs:
      x: {IRanges: {start: [1, 2], end: [3, 5], width: [3, 4]}}
    call: {op: identity, args: [x]}
  - id: ir-con-all-three-mismatch
    clause: IR-CON-ALL3-1
    inputs:
      x: {IRanges: {start: [1, 2], end: [3, 5], width: [3, 3]}}
    call: {op: identity, args: [x]}
  - id: ir-con-one-arg
    clause: IR-CON-TWO-1
    inputs:
      x: {IRanges: {end: [3, 5]}}
    call: {op: identity, args: [x]}
  - id: ir-con-end-lt-start
    clause: IR-CON-ENDLT-1
    inputs:
      x: {IRanges: {start: [5], end: [2]}}
    call: {op: identity, args: [x]}
  - id: ir-con-int32-overflow
    clause: IR-CON-INT32-1
    inputs:
      x: {IRanges: {start: [2147483647], width: [2]}}
    call: {op: identity, args: [x]}
    adr: ADR-0006
    python: {expect_error: true}
  - id: ir-con-start-only-runs
    clause: IR-CON-TWO-1
    inputs:
      x: {IRanges: {start: [1, 2, 3, 7]}}
    call: {op: identity, args: [x]}
    adr: ADR-0011
    python: {expect_error: true}
