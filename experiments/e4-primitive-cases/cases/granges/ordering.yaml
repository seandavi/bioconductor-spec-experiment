    clause: GR-RANK-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: rank, args: [x], kwargs: {ties.method: last}}
  - id: gr-rank-min
    clause: GR-RANK-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: rank, args: [x], kwargs: {ties.method: min}}
  - id: gr-rank-max
    clause: GR-RANK-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: rank, args: [x], kwargs: {ties.method: max}}
  - id: gr-dup
    clause: GR-DUP-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: duplicated, args: [x]}
  - id: gr-dup-from-last
    clause: GR-DUP-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: duplicated, args: [x], kwargs: {fromLast: true}}
  - id: gr-dup-strand-matters
    clause: GR-DUP-2
    inputs:
      x: {GRanges: {seqnames: [a, a], start: [1, 1], width: [1, 1], strand: ["+", "-"]}}
    call: {op: duplicated, args: [x]}
  - id: gr-dup-ignores-names
    clause: GR-DUP-2
    inputs:
      x: {GRanges: {seqnames: [a, a], start: [1, 1], width: [1, 1], names: [x, y]}}
    call: {op: duplicated, args: [x]}
  - id: gr-unique
    clause: GR-UNIQUE-1
    inputs:
      x: {GRanges: {seqnames: [b, a, a, b, a, a, c, a], start: [5, 5, 1, 5, 5, 5, 1, 5], width: [2, 2, 3, 2, 1, 2, 1, 2], strand: ["+", "-", "+", "*", "+", "+", "-", "-"], names: [a, b, c, d, e, f, g, h], mcols: {s: [1, 2, 3, 4, 5, 6, 7, 8]}, seqinfo: {seqnames: [b, a, c]}}}
    call: {op: unique, args: [x]}
