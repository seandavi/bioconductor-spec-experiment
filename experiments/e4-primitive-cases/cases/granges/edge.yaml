  - id: gr-edge-circular-coverage-mixed
    clause: GR-EDGE-6
    inputs:
      x: {GRanges: {seqnames: [c, c, c, c, d], start: [-2, 28, 10, 5, 18], width: [5, 5, 70, 0, 6], seqinfo: {seqnames: [c, d], seqlengths: [30, 20], isCircular: [true, false]}}}
    call: {op: coverage, args: [x]}
  - id: gr-edge-circular-coverage-weight
    clause: GR-EDGE-6
    inputs:
      x: {GRanges: {seqnames: [c, c, c, c, d], start: [-2, 28, 10, 5, 18], width: [5, 5, 70, 0, 6], seqinfo: {seqnames: [c, d], seqlengths: [30, 20], isCircular: [true, false]}}}
    call: {op: coverage, args: [x], kwargs: {weight: [1, 2, 3, 4, 5]}}
  - id: gr-edge-circular-coverage-shift
    clause: GR-EDGE-6
    inputs:
      x: {GRanges: {seqnames: [c, c, c, c, d], start: [-2, 28, 10, 5, 18], width: [5, 5, 70, 0, 6], seqinfo: {seqnames: [c, d], seqlengths: [30, 20], isCircular: [true, false]}}}
