    call: {op: coverage, args: [x]}
  - id: gr-edge-circular-coverage-wrap-start
    clause: GR-EDGE-6
    inputs:
      x: {GRanges: {seqnames: [c], start: [-5], width: [10], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: coverage, args: [x]}
  - id: gr-edge-circular-concat-flags
    clause: GR-EDGE-1
    inputs:
      x: {GRanges: {seqnames: [c], start: [1], width: [1], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true], genome: g1}}}
      z: {GRanges: {seqnames: [c], start: [1], width: [1], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true], genome: g1}}}
    call: {op: c, args: [x, z]}
  - id: gr-edge-seqname-empty-string
    clause: GR-EDGE-2
    inputs:
      x: {GRanges: {seqnames: [""], start: [1], width: [1]}}
    call: {op: identity, args: [x]}
  - id: gr-edge-seqname-with-space
    clause: GR-EDGE-2
    inputs:
      x: {GRanges: {seqnames: ["chr 1"], start: [1], width: [1]}}
    call: {op: identity, args: [x]}
  - id: gr-edge-seqname-unicode
    clause: GR-EDGE-2
    inputs:
      x: {GRanges: {seqnames: [é], start: [1], width: [1]}}
    call: {op: seqlevels, args: [x]}
  - id: gr-edge-seqname-repeats-order
    clause: GR-EDGE-2
    inputs:
      x: {GRanges: {seqnames: [b, a, b], start: [1, 2, 3], width: [1, 1, 1]}}
    call: {op: identity, args: [x]}
  - id: gr-edge-seqlength-zero
    clause: GR-EDGE-3
    inputs:
      x: {GRanges: {seqnames: [a], start: [1], width: [1], seqinfo: {seqnames: [a], seqlengths: [0]}}}
    call: {op: seqlengths, args: [x]}
  - id: gr-edge-names-na
    clause: GR-EDGE-3
    inputs:
      x: {GRanges: {seqnames: [a, a], start: [1, 2], width: [1, 1], names: [x, null]}}
    call: {op: names, args: [x]}
  - id: gr-edge-empty-sort
    clause: GR-EDGE-4
