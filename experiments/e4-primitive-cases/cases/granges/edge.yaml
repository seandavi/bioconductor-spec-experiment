      x: {GRanges: {seqnames: [c, c], start: [5, 28], width: [3, 3], strand: ["+", "+"], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: promoters, args: [x], kwargs: {upstream: 10, downstream: 3}}
  - id: gr-edge-circular-trim-after-shift
    clause: GR-EDGE-1
    inputs:
      x: {GRanges: {seqnames: [c, c], start: [10, 33], width: [3, 3], strand: ["+", "+"], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: trim, args: [x]}
  - id: gr-edge-circular-reduce
