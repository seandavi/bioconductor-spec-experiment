cases:
  - id: gr-edge-circular-shift-no-wrap
    clause: GR-EDGE-1
    inputs:
      x: {GRanges: {seqnames: [c, c], start: [5, 28], width: [3, 3], strand: ["+", "+"], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: shift, args: [x], kwargs: {shift: 5}}
  - id: gr-edge-circular-resize
    clause: GR-EDGE-1
    inputs:
      x: {GRanges: {seqnames: [c, c], start: [5, 28], width: [3, 3], strand: ["+", "+"], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: resize, args: [x], kwargs: {width: 10}}
  - id: gr-edge-circular-flank
    clause: GR-EDGE-1
    inputs:
      x: {GRanges: {seqnames: [c, c], start: [5, 28], width: [3, 3], strand: ["+", "+"], seqinfo: {seqnames: [c], seqlengths: [30], isCircular: [true]}}}
    call: {op: flank, args: [x], kwargs: {width: 10}}
  - id: gr-edge-circular-promoters
