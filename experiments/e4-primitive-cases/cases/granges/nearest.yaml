    inputs:
      x: {GRanges: {seqnames: [a, a, a, b, a, a], start: [20, 20, 20, 20, 1, 100], width: [2, 2, 2, 2, 2, 2], strand: ["+", "-", "*", "+", "*", "+"], names: [q1, q2, q3, q4, q5, q6], mcols: {s: [1, 2, 3, 4, 5, 6]}, seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a, a, a, b, a], start: [1, 10, 30, 25, 35], width: [3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*"], seqinfo: {seqnames: [a, b]}}}
    call: {op: follow, args: [x, z], kwargs: {ignore.strand: true}}
  - id: gr-follow-star-direction-from-subject
    clause: GR-FOLLOW-3
    inputs:
