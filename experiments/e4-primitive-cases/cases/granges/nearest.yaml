      z: {GRanges: {seqnames: [a, a, a, b, a, a], start: [1, 10, 30, 25, 35, 1], width: [3, 3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*", "+"], seqinfo: {seqnames: [a, b]}}}
