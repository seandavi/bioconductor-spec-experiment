cases:
  - id: gr-nearest
    clause: GR-NEAREST-1
    inputs:
      x: {GRanges: {seqnames: [a, a, a, b, a, a], start: [20, 20, 20, 20, 1, 100], width: [2, 2, 2, 2, 2, 2], strand: ["+", "-", "*", "+", "*", "+"], names: [q1, q2, q3, q4, q5, q6], mcols: {s: [1, 2, 3, 4, 5, 6]}, seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a, a, a, b, a], start: [1, 10, 30, 25, 35], width: [3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*"], seqinfo: {seqnames: [a, b]}}}
    call: {op: nearest, args: [x, z]}
    compare: {fields: {values: oneof}}
    oneof_from: {kwargs: {select: all}}
    adr: ADR-0005
  - id: gr-nearest-all
    clause: GR-NEAREST-1
    inputs:
      x: {GRanges: {seqnames: [a, a, a, b, a, a], start: [20, 20, 20, 20, 1, 100], width: [2, 2, 2, 2, 2, 2], strand: ["+", "-", "*", "+", "*", "+"], names: [q1, q2, q3, q4, q5, q6], mcols: {s: [1, 2, 3, 4, 5, 6]}, seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a, a, a, b, a], start: [1, 10, 30, 25, 35], width: [3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*"], seqinfo: {seqnames: [a, b]}}}
    call: {op: nearest, args: [x, z], kwargs: {select: all}}
  - id: gr-nearest-ignore-strand-all
    clause: GR-NEAREST-2
    inputs:
      x: {GRanges: {seqnames: [a, a, a, b, a, a], start: [20, 20, 20, 20, 1, 100], width: [2, 2, 2, 2, 2, 2], strand: ["+", "-", "*", "+", "*", "+"], names: [q1, q2, q3, q4, q5, q6], mcols: {s: [1, 2, 3, 4, 5, 6]}, seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a, a, a, b, a], start: [1, 10, 30, 25, 35], width: [3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*"], seqinfo: {seqnames: [a, b]}}}
    call: {op: nearest, args: [x, z], kwargs: {select: all, ignore.strand: true}}
  - id: gr-nearest-ignore-strand
    clause: GR-NEAREST-2
    inputs:
      x: {GRanges: {seqnames: [a, a, a, b, a, a], start: [20, 20, 20, 20, 1, 100], width: [2, 2, 2, 2, 2, 2], strand: ["+", "-", "*", "+", "*", "+"], names: [q1, q2, q3, q4, q5, q6], mcols: {s: [1, 2, 3, 4, 5, 6]}, seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a, a, a, b, a], start: [1, 10, 30, 25, 35], width: [3, 3, 3, 3, 3], strand: ["+", "-", "+", "+", "*"], seqinfo: {seqnames: [a, b]}}}
    call: {op: nearest, args: [x, z], kwargs: {ignore.strand: true}}
    compare: {fields: {values: oneof}}
    oneof_from: {kwargs: {select: all}}
    adr: ADR-0005
  - id: gr-nearest-other-seqname-only
    clause: GR-NEAREST-3
    inputs:
      x: {GRanges: {seqnames: [b], start: [1], width: [1], strand: ["+"], seqinfo: {seqnames: [a, b]}}}
      z: {GRanges: {seqnames: [a], start: [1], width: [1], strand: ["+"], seqinfo: {seqnames: [a, b]}}}
    call: {op: nearest, args: [x, z]}
  - id: gr-nearest-empty-subject
