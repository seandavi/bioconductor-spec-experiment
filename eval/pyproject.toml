[project]
name = "bioc-eval"
version = "0.1.0"
description = "Fidelity-to-R evaluation harness for the IRanges/GRanges port experiments"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.build-backend]
module-name = "bioc_eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runner", "adapters", "selftest"]
